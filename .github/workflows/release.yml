name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build unsigned macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./Scripts/package-app.sh

      - name: Archive unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/SuperKMenu.app \
            "SuperKMenu-${GITHUB_REF_NAME}-unsigned.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "SuperKMenu-${GITHUB_REF_NAME}-unsigned.zip" \
            --title "SuperKMenu $GITHUB_REF_NAME" \
            --notes "Unsigned macOS build. After extracting, move SuperKMenu.app to /Applications, launch it once, enable the Finder extension in System Settings if needed, then restart Finder."
